<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo Từ Vựng Tiếng Nhật</title>
    <script src="chuong1.js"></script>
    <script src="chuong2.js"></script>
    <script src="chuong3.js"></script>
    <script src="chuong4.js"></script>
    <script src="chuong5.js"></script>
    <script src="chuong6.js"></script>
    <script src="dem.js"></script>
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4a5568;
            --accent: #e53e3e;
            --border: #e2e8f0;
            --success: #38a169;
            --star: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* GIAO DIỆN MENU CHỌN CHƯƠNG */
        .menu-container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            border: 1px solid var(--border);
        }

        .menu-title {
            font-size: 1.8rem;
            color: #1a202c;
            margin-bottom: 25px;
            margin-top: 0;
            text-align: center;
        }

        .section-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
            text-align: left;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 5px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            text-align: left;
        }

        .custom-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .custom-label:hover {
            border-color: var(--primary);
            background-color: #edf2f7;
        }

        .custom-label input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .start-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 10px;
        }

        .start-btn:hover { background-color: #2d3748; }
        .start-btn:active { transform: scale(0.98); }

        /* GIAO DIỆN FLASHCARD */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            text-align: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: none; 
        }
        
        .card:active { transform: scale(0.98); }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-menu-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .back-menu-btn:hover { background: #edf2f7; color: var(--accent); }

        .progress {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Nút đánh dấu sao */
        .star-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #cbd5e0; 
            transition: all 0.2s;
            padding: 0 5px;
        }
        .star-btn:hover { transform: scale(1.1); }
        .star-btn.marked { color: var(--accent); }

        .word-vn {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 30px 0;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a202c;
        }

        .listen-prompt {
            margin: 30px 0;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #edf2f7;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .listen-prompt:hover { background: #e2e8f0; transform: scale(1.03); }
        .listen-prompt .big-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .listen-prompt .small-text { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

        .answer-box {
            margin: 30px 0;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .word-jp {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent);
            animation: fadeIn 0.2s ease-in-out;
        }

        .speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            pointer-events: auto;
            font-size: 2rem; 
        }
        .speak-btn:hover { background-color: #edf2f7; transform: scale(1.15); }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            pointer-events: auto;
        }

        .btn-prev { background-color: #4a5568; flex: 1; max-width: 120px; }
        .btn-prev:hover { background-color: #718096; }
        .btn-main { flex: 2; }
        .btn-main:hover { background-color: #718096; }
        .btn-finish { background-color: var(--success) !important; }
        .btn-finish:hover { background-color: #2f855a !important; }

        .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 25px;
            line-height: 1.4;
        }

        /* Giao diện kết thúc */
        #end-screen {
            padding: 20px 0;
            display: none;
        }
        #end-screen h2 { font-size: 2rem; color: var(--success); margin-bottom: 10px; }
        #end-screen p { color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-container" id="menu">
        <h2 class="menu-title">📚 Cài đặt ôn tập</h2>
        
        <span class="section-title">1. Chế độ học</span>
        <div class="option-group">
            <label class="custom-label">
                <input type="radio" name="studyMode" value="flashcard" checked> 
                👁️ FlashCard Tiếng Việt ➔ Tiếng Nhật
            </label>
            <label class="custom-label">
                <input type="radio" name="studyMode" value="listening"> 
                🎧 Nghe Tiếng Nhật ➔ Chính tả
            </label>
        </div>

        <span class="section-title">2. Chọn bài học</span>
        <div class="option-group">
            <label class="custom-label">
                <input type="checkbox" id="chk-chuong1" checked> 
                Chương 1: Chào hỏi & Nghề nghiệp
            </label>
            <label class="custom-label">
                <input type="checkbox" id="chk-chuong2"> 
                Chương 2: Đồ vật & Sở hữu
            </label>
            <label class="custom-label">
                <input type="checkbox" id="chk-chuong3"> 
                Chương 3: Nơi chốn & Phương hướng
            </label>
            <label class="custom-label">
                <input type="checkbox" id="chk-chuong4"> 
                Chương 4: Thời gian & Sự kiện
            </label>
            <label class="custom-label">
                <input type="checkbox" id="chk-chuong5"> 
                Chương 5: Các tính từ
            </label>
            <label class="custom-label">
                <input type="checkbox" id="chk-chuong6"> 
                Chương 6: Các động từ p1
            </label>
            <label class="custom-label">
                <input type="checkbox" id="chk-dem"> 
                Đếm các loại đối tượng
            </label>
        </div>

        <button class="start-btn" onclick="startReview()">Bắt đầu ôn tập</button>
    </div>

    <div class="card" id="flashcard" onclick="handleCardClick(event)">
        <div class="header-bar" id="flashcard-header">
            <button class="back-menu-btn" onclick="returnToMenu(event)">⬅ Menu</button>
            <div class="progress" id="progress">Câu 0/0</div>
            <button id="star-btn" class="star-btn" onclick="toggleMark(event)" title="Đánh dấu câu này">☆</button>
        </div>
        
        <div id="flashcard-content">
            <div class="word-vn" id="word-vn">Đang tải...</div>

            <div class="listen-prompt" id="listen-prompt" style="display: none;" onclick="playAudio(event)">
                <div class="big-icon">🔊</div>
                <div class="small-text">Bấm để nghe lại</div>
            </div>
            
            <div class="answer-box">
                <div class="word-jp" id="word-jp" style="display: none;"></div>
                <button class="speak-btn" id="speak-btn" style="display: none;" onclick="playAudio(event)" title="Nghe phát âm">🔊</button>
            </div>
            
            <div class="button-group">
                <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion(event)">Quay lại</button>
                <button class="btn btn-main" id="action-btn" onclick="handleActionClick(event)">Xem đáp án</button>
            </div>
            
            <div class="hint">Mẹo: Nhấn <b>Enter / Mũi tên phải</b> hoặc <b>Chạm màn hình</b> để đi tiếp. <br>Nhấn <b>Mũi tên trái</b> để quay lại.</div>
        </div>

        <div id="end-screen">
            <h2>🎉 Hoàn thành!</h2>
            <p>Bạn đã xuất sắc đi hết bộ từ vựng lần này.</p>
            <div class="option-group" style="align-items: center; margin-bottom: 0;">
                <button class="start-btn" onclick="restartAll(event)">🔄 Ôn lại bộ này từ đầu</button>
                <button class="start-btn" id="btn-review-marked" onclick="reviewMarked(event)" style="background-color: var(--accent); display: none;">⭐ Ôn lại câu đã đánh dấu (0)</button>
                <button class="start-btn" onclick="returnToMenu(event)" style="background-color: var(--text-muted);">🏠 Trở về Menu chọn bài</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentVocab = {}; 
    let questions = [];
    let currentIndex = 0;
    let isShowingAnswer = false;
    let currentChapterName = "";
    let currentMode = "flashcard"; 
    let markedQuestions = new Set(); // Bộ nhớ lưu các câu đã đánh dấu

    function startReview() {
        currentVocab = {};
        let selectedNames = [];

        currentMode = document.querySelector('input[name="studyMode"]:checked').value;

        if (document.getElementById('chk-chuong1').checked && typeof vocabChuong1 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong1);
            selectedNames.push("Ch.1");
        }
        if (document.getElementById('chk-chuong2').checked && typeof vocabChuong2 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong2);
            selectedNames.push("Ch.2");
        }
        if (document.getElementById('chk-chuong3').checked && typeof vocabChuong3 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong3);
            selectedNames.push("Ch.3");
        }
        if (document.getElementById('chk-chuong4').checked && typeof vocabChuong4 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong4);
            selectedNames.push("Ch.4");
        }
        if (document.getElementById('chk-chuong5').checked && typeof vocabChuong5 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong5);
            selectedNames.push("Ch.5");
        }
        if (document.getElementById('chk-chuong6').checked && typeof vocabChuong6 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong6);
            selectedNames.push("Ch.6");
        }
        if (document.getElementById('chk-dem').checked && typeof generateMixedCounters === 'function') {
            Object.assign(currentVocab, generateMixedCounters(5)); 
            selectedNames.push("Đếm số");
        }
        
        if (selectedNames.length === 0) {
            alert("Vui lòng chọn ít nhất 1 chương để ôn tập!");
            return;
        }

        currentChapterName = selectedNames.join(" + ");
        questions = Object.keys(currentVocab);
        
        // Reset bộ nhớ đánh dấu khi bắt đầu bộ mới hoàn toàn
        markedQuestions.clear();

        document.getElementById('menu').style.display = 'none';
        document.getElementById('flashcard').style.display = 'block';
        
        initRound();
    }

    // Toggle (Bật/Tắt) đánh dấu sao
    function toggleMark(event) {
        if (event) event.stopPropagation(); 
        let currentWord = questions[currentIndex];
        
        if (markedQuestions.has(currentWord)) {
            markedQuestions.delete(currentWord);
        } else {
            markedQuestions.add(currentWord);
        }
        updateStarUI();
    }

    // Cập nhật giao diện của nút Sao
    function updateStarUI() {
        let currentWord = questions[currentIndex];
        let starBtn = document.getElementById('star-btn');
        if (markedQuestions.has(currentWord)) {
            starBtn.innerText = '★';
            starBtn.classList.add('marked');
        } else {
            starBtn.innerText = '☆';
            starBtn.classList.remove('marked');
        }
    }

    function returnToMenu(event) {
        if(event) event.stopPropagation();
        document.getElementById('flashcard').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initRound() {
        // Đảm bảo hiển thị giao diện flashcard, ẩn màn hình kết thúc
        document.getElementById('flashcard-content').style.display = 'block';
        document.getElementById('flashcard-header').style.display = 'flex';
        document.getElementById('end-screen').style.display = 'none';
        
        shuffleArray(questions);
        currentIndex = 0;
        showQuestion();
    }

    function showQuestion() {
        isShowingAnswer = false;
        
        document.getElementById('progress').innerText = `${currentChapterName} | Câu ${currentIndex + 1}/${questions.length}`;
        updateStarUI(); // Cập nhật trạng thái sao cho từ hiện tại
        
        if (currentMode === 'flashcard') {
            document.getElementById('word-vn').innerText = questions[currentIndex];
            document.getElementById('word-vn').style.display = 'flex';
            document.getElementById('listen-prompt').style.display = 'none';
        } else {
            document.getElementById('word-vn').style.display = 'none';
            document.getElementById('listen-prompt').style.display = 'flex';
            setTimeout(() => playAudio(null), 150); 
        }

        document.getElementById('word-jp').style.display = 'none';
        document.getElementById('speak-btn').style.display = 'none'; 
        
        const actionBtn = document.getElementById('action-btn');
        actionBtn.innerText = 'Xem đáp án (Enter)';
        actionBtn.classList.remove('btn-finish');

        const prevBtn = document.getElementById('prev-btn');
        if (currentIndex === 0) {
            prevBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'block';
        }
    }

    function speakJapanese(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; 
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function playAudio(event) {
        if(event) event.stopPropagation(); 
        const currentVN = questions[currentIndex];
        const correctJP = currentVocab[currentVN];
        speakJapanese(correctJP);
    }

    function showAnswer() {
        isShowingAnswer = true;
        const currentVN = questions[currentIndex];
        const correctJP = currentVocab[currentVN];
        
        const vnElement = document.getElementById('word-vn');
        vnElement.innerText = currentVN;
        vnElement.style.display = 'flex';
        
        document.getElementById('listen-prompt').style.display = 'none'; 
        
        const answerElement = document.getElementById('word-jp');
        answerElement.innerText = correctJP;
        answerElement.style.display = 'block';
        
        document.getElementById('speak-btn').style.display = 'flex'; 
        
        if (currentMode === 'flashcard') {
            playAudio(null);
        }

        const actionBtn = document.getElementById('action-btn');
        if (currentIndex === questions.length - 1) {
            actionBtn.innerText = 'Kết thúc';
            actionBtn.classList.add('btn-finish');
        } else {
            actionBtn.innerText = 'Tiếp theo';
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= questions.length) {
            showEndScreen();
        } else {
            showQuestion();
        }
    }

    // Hiển thị màn hình tổng kết
    function showEndScreen() {
        document.getElementById('flashcard-content').style.display = 'none';
        document.getElementById('flashcard-header').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';

        let btnMarked = document.getElementById('btn-review-marked');
        if (markedQuestions.size > 0) {
            btnMarked.innerText = `⭐ Ôn lại câu đã đánh dấu (${markedQuestions.size})`;
            btnMarked.style.display = 'block';
        } else {
            btnMarked.style.display = 'none';
        }
    }

    // Ôn lại từ đầu bộ hiện tại
    function restartAll(event) {
        if(event) event.stopPropagation();
        startReview(); // Gọi lại startReview để bốc ngẫu nhiên lại từ đầu
    }

    // Chỉ ôn lại các câu đã đánh dấu sao
    function reviewMarked(event) {
        if(event) event.stopPropagation();
        // Lấy danh sách các câu đã đánh dấu làm bộ câu hỏi mới
        questions = Array.from(markedQuestions);
        currentChapterName = "⭐ Đã đánh dấu";
        
        // Không clear markedQuestions để người học có thể bỏ đánh dấu từ từ khi đã thuộc
        initRound();
    }

    function prevQuestion(event) {
        if(event) event.stopPropagation();
        if (currentIndex > 0) {
            currentIndex--;
            showQuestion();
        }
    }

    function handleActionClick(event) {
        if(event) event.stopPropagation();
        handleMainLogic();
    }

    function handleCardClick(event) {
        // Ngăn chặn click khi đang ở màn hình End Screen hoặc bấm vào các nút điều khiển
        if (document.getElementById('end-screen').style.display === 'block') return;
        if (event.target.closest('button') || event.target.closest('input') || event.target.closest('.listen-prompt')) return;
        handleMainLogic();
    }

    function handleMainLogic() {
        if (!isShowingAnswer) {
            showAnswer();
        } else {
            nextQuestion();
        }
    }

    window.addEventListener('keydown', function(event) {
        if (document.getElementById('flashcard').style.display === 'block' && document.getElementById('end-screen').style.display === 'none') {
            if (event.key === 'Enter' || event.key === 'ArrowRight') {
                handleMainLogic();
            } else if (event.key === 'ArrowLeft') {
                prevQuestion(null);
            }
        }
    });

</script>

</body>
</html>
