<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo Từ Vựng Tiếng Nhật</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4a5568;
            --accent: #e53e3e;
            --border: #e2e8f0;
            --success: #38a169;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            text-align: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        
        .card:active {
            transform: scale(0.98);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .progress {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 25px;
        }

        .word-vn {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 30px 0;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a202c;
        }

        .answer-box {
            margin: 30px 0;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .word-jp {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent);
            animation: fadeIn 0.2s ease-in-out;
        }

        /* Container chứa các nút */
        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            pointer-events: auto; /* Cho phép click trực tiếp vào nút */
        }

        /* Nút quay lại */
        .btn-prev {
            background-color: #a0aec0;
            flex: 1;
            max-width: 120px;
        }

        .btn-prev:hover {
            background-color: #718096;
        }

        /* Nút chính */
        .btn-main {
            flex: 2;
        }

        .btn-main:hover {
            background-color: #2d3748;
        }

        /* Nút khi đến từ cuối cùng */
        .btn-finish {
            background-color: var(--success) !important;
        }

        .btn-finish:hover {
            background-color: #2f855a !important;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 25px;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" onclick="handleCardClick(event)">
        <div class="progress" id="progress">Vòng 1 | Câu 0/0</div>
        
        <div class="word-vn" id="word-vn">Đang tải...</div>
        
        <div class="answer-box">
            <div class="word-jp" id="word-jp" style="display: none;"></div>
        </div>
        
        <div class="button-group">
            <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion(event)">Quay lại</button>
            <button class="btn btn-main" id="action-btn" onclick="handleActionClick(event)">Xem đáp án</button>
        </div>
        
        <div class="hint">Mẹo: Nhấn <b>Enter / Mũi tên phải</b> hoặc <b>Chạm màn hình</b> để đi tiếp. <br>Nhấn <b>Mũi tên trái</b> để quay lại.</div>
    </div>
</div>

<script>
    const vocab = {
        "Chào buổi sáng": "おはよう ございます",
        "Chào buổi trưa": "こんにちは",
        "Chào buổi tối": "こんばんは",
        "Tạm biệt bạn nhé": "さようなら",
        "Chúc bạn ngủ ngon": "おやすみ なさい",
        "Xin chúc mừng bạn": "おめでとう ございます",
        "Xin cảm ơn bạn": "ありがとう ございます",
        "Bạn khỏe không?": "おげんき ですか",
        "Vâng, tôi khỏe": "はい、げんき です",
        "Hân hạnh được gặp bạn": "はじめまして",
        "Rất mong được bạn giúp đỡ": "よろしく おねがいします",
        "Tôi": "わたし",
        "Chúng tôi": "わたしたち",
        "Bạn, anh, chị (ngôi thứ 2)": "あなた",
        "Người": "ひと",
        "Người này": "この ひと",
        "Người kia": "あの ひと",
        "Vị": "かた",
        "Vị này": "この かた",
        "Vị kia": "あの かた",
        "Bạn~, anh~, chị~, ông~, bà~": "～さん",
        "Thầy, Cô": "せんせい",
        "Học sinh, học viên": "がくせい",
        "Sinh viên": "だいがくせい",
        "Giáo viên": "きょうし",
        "Nhân viên cửa hàng": "てんいん",
        "Nhân viên công ty": "かいしゃいん",
        "Nhân viên ngân hàng": "ぎんこういん",
        "Bác sĩ": "いしゃ",
        "Nội trợ": "しゅふ",
        "Ca sĩ": "かしゅ",
        "Tài xế": "うんてんしゅ",
        "Công việc": "しごと",
        "(Anh / Chị) làm công việc gì?": "おしごとは？",
        "Vâng": "はい",
        "Không": "いいえ",
        "Ai?": "だれ？",
        "Ai, vị nào?": "どなた？",
        "Tên": "なまえ",
        "(Anh / Chị) tên gì?": "おなまえは？",
        "Việt Nam": "べとなむ",
        "Nhật Bản": "にほん",
        "Hàn Quốc": "かんこく",
        "Trung Quốc": "ちゅうごく",
        "Đài Loan": "たいわん",
        "Người ~": "～じん",
        "Người Việt Nam": "べとなむじん",
        "Người Nhật Bản": "にほんじん",
        "Quốc tịch": "こくせき",
        "(Anh / Chị) quốc tịch gì?": "ごこくせきは？",
        "Hiệu trưởng": "こうちょう",
        "Giám đốc": "しゃちょう",
        "Cửa hàng trưởng": "てんちょう",
        "Cán bộ nhà nước": "こうむいん",
        "Cảnh sát": "けいさつかん",
        "Đầu bếp": "ちょうりし",
        "Luật sư": "べんごし",
        "Y tá": "かんごし",
        "Điều dưỡng": "かいごし",
        "Kỹ sư": "えんじにあ",
        "Thái Lan": "たい",
        "Ấn Độ": "いんど",
        "Anh": "いぎりす",
        "Pháp": "ふらんす",
        "Mỹ": "あめりか",
        "Đức": "どいつ",
        "Ý": "いたりあ",
        "Một lần nữa": "もういちど",
        "Xin vui lòng lặp lại lần nữa": "もういちど おねがいします",
        "Hãy đứng lên": "たってください",
        "Hãy ngồi xuống": "すわってください",
        "Hãy nói": "いってください",
        "Hãy viết": "かいてください",
        "Hãy nghe": "きいてください",
        "Hãy đọc": "よんでください",
        "Hãy nhìn": "みてください",
        "Hãy nhớ": "おぼえてください",
        "Chúng ta bắt đầu nào": "はじめましょう",
        "Chúng ta nghỉ giải lao nào": "やすみましょう",
        "Chúng ta kết thúc nào": "おわりましょう",
        "Xin lỗi (khi làm phiền/gọi ai đó)": "すみません",
        "Xin mời": "どうぞ"
    };

    let questions = Object.keys(vocab);
    let currentIndex = 0;
    let isShowingAnswer = false;
    let roundNumber = 1;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initRound() {
        shuffleArray(questions);
        currentIndex = 0;
        showQuestion();
    }

    function showQuestion() {
        isShowingAnswer = false;
        
        // Cập nhật text UI
        document.getElementById('progress').innerText = `Vòng ${roundNumber} | Câu ${currentIndex + 1}/${questions.length}`;
        document.getElementById('word-vn').innerText = questions[currentIndex];
        document.getElementById('word-jp').style.display = 'none';
        
        // Trạng thái nút Hành động chính
        const actionBtn = document.getElementById('action-btn');
        actionBtn.innerText = 'Xem đáp án (Enter)';
        actionBtn.classList.remove('btn-finish');

        // Trạng thái nút Quay lại (Ẩn ở câu đầu tiên)
        const prevBtn = document.getElementById('prev-btn');
        if (currentIndex === 0) {
            prevBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'block';
        }
    }

    function showAnswer() {
        isShowingAnswer = true;
        const currentVN = questions[currentIndex];
        const correctJP = vocab[currentVN];
        
        const answerElement = document.getElementById('word-jp');
        answerElement.innerText = correctJP;
        answerElement.style.display = 'block';
        
        const actionBtn = document.getElementById('action-btn');
        
        // Kiểm tra xem có phải câu cuối không để đổi giao diện nút
        if (currentIndex === questions.length - 1) {
            actionBtn.innerText = 'Kết thúc vòng';
            actionBtn.classList.add('btn-finish');
        } else {
            actionBtn.innerText = 'Tiếp theo';
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= questions.length) {
            alert(`🎉 Chúc mừng! Bạn đã hoàn thành xuất sắc tất cả ${questions.length} từ vựng ở Vòng ${roundNumber}! Hệ thống sẽ tự động xáo trộn sang vòng tiếp theo.`);
            roundNumber++;
            initRound();
        } else {
            showQuestion();
        }
    }

    function prevQuestion(event) {
        // Ngăn sự kiện click lan truyền ra thẻ card bên ngoài
        if(event) event.stopPropagation();
        
        if (currentIndex > 0) {
            currentIndex--;
            showQuestion();
        }
    }

    // Xử lý khi click vào nút hành động chính (để ngăn nổi bọt sự kiện)
    function handleActionClick(event) {
        if(event) event.stopPropagation();
        handleMainLogic();
    }

    // Xử lý khi click vào bất cứ đâu trên thẻ Card
    function handleCardClick(event) {
        // Tránh bị gọi 2 lần nếu click trúng vào các button đã có sự kiện riêng
        if (event.target.tagName.toLowerCase() === 'button') return;
        handleMainLogic();
    }

    // Logic chính của việc lật thẻ / đi tiếp
    function handleMainLogic() {
        if (!isShowingAnswer) {
            showAnswer();
        } else {
            nextQuestion();
        }
    }

    // Hỗ trợ điều hướng bằng bàn phím
    window.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === 'ArrowRight') {
            handleMainLogic();
        } else if (event.key === 'ArrowLeft') {
            prevQuestion(null);
        }
    });

    window.onload = initRound;
</script>

</body>
</html>
