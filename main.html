<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo Từ Vựng Tiếng Nhật</title>
    <!-- GỌI CÁC FILE DATA VÀO ĐÂY -->
    <script src="chuong1.js"></script>
    <script src="chuong2.js"></script>
    <script src="tuoi.js"></script>
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4a5568;
            --accent: #e53e3e;
            --border: #e2e8f0;
            --success: #38a169;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* GIAO DIỆN MENU CHỌN CHƯƠNG */
        .menu-container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            border: 1px solid var(--border);
        }

        .menu-title {
            font-size: 1.8rem;
            color: #1a202c;
            margin-bottom: 25px;
            margin-top: 0;
            text-align: center;
        }

        /* Tùy chỉnh danh sách chọn chương */
        .chapter-selection {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            text-align: left;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .checkbox-label:hover {
            border-color: var(--primary);
            background-color: #edf2f7;
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .start-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .start-btn:hover { background-color: #2d3748; }
        .start-btn:active { transform: scale(0.98); }

        /* GIAO DIỆN FLASHCARD */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            text-align: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: none; /* Ẩn thẻ card ban đầu */
        }
        
        .card:active { transform: scale(0.98); }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-menu-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .back-menu-btn:hover { background: #edf2f7; color: var(--accent); }

        .progress {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .word-vn {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 30px 0;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a202c;
        }

        .answer-box {
            margin: 30px 0;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .word-jp {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent);
            animation: fadeIn 0.2s ease-in-out;
        }

        .speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            pointer-events: auto;
            font-size: 2rem; 
        }
        .speak-btn:hover { background-color: #edf2f7; transform: scale(1.15); }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            pointer-events: auto;
        }

        .btn-prev { background-color: #4a5568; flex: 1; max-width: 120px; }
        .btn-prev:hover { background-color: #718096; }
        .btn-main { flex: 2; }
        .btn-main:hover { background-color: #718096; }
        .btn-finish { background-color: var(--success) !important; }
        .btn-finish:hover { background-color: #2f855a !important; }

        .hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 25px;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- MENU CHỌN CHƯƠNG -->
    <div class="menu-container" id="menu">
        <h2 class="menu-title">📚 Chọn bài ôn tập</h2>
        
        <div class="chapter-selection">
            <!-- Sau này có thêm data thì cứ copy thêm thẻ <label> này xuống dưới -->
            <label class="checkbox-label">
                <input type="checkbox" id="chk-chuong1" checked> 
                Chương 1: 
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-chuong2"> 
                Chương 2:
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-tuoi"> 
                Tuổi tác:
            </label>
        </div>

        <button class="start-btn" onclick="startReview()">Bắt đầu ôn tập</button>
    </div>

    <!-- KHU VỰC FLASHCARD -->
    <div class="card" id="flashcard" onclick="handleCardClick(event)">
        <div class="header-bar">
            <button class="back-menu-btn" onclick="returnToMenu(event)">⬅ Menu</button>
            <div class="progress" id="progress">Câu 0/0</div>
        </div>
        
        <div class="word-vn" id="word-vn">Đang tải...</div>
        
        <div class="answer-box">
            <div class="word-jp" id="word-jp" style="display: none;"></div>
            <button class="speak-btn" id="speak-btn" style="display: none;" onclick="playAudio(event)" title="Nghe phát âm">🔊</button>
        </div>
        
        <div class="button-group">
            <button class="btn btn-prev" id="prev-btn" onclick="prevQuestion(event)">Quay lại</button>
            <button class="btn btn-main" id="action-btn" onclick="handleActionClick(event)">Xem đáp án</button>
        </div>
        
        <div class="hint">Mẹo: Nhấn <b>Enter / Mũi tên phải</b> hoặc <b>Chạm màn hình</b> để đi tiếp. <br>Nhấn <b>Mũi tên trái</b> để quay lại.</div>
    </div>
</div>

<script>
    // Các biến toàn cục
    let currentVocab = {}; 
    let questions = [];
    let currentIndex = 0;
    let isShowingAnswer = false;
    let currentChapterName = "";

    // Gộp data và bắt đầu
    function startReview() {
        currentVocab = {};
        let selectedNames = [];

        // Kiểm tra xem checkbox nào được tick thì gộp data vào
        if (document.getElementById('chk-chuong1').checked && typeof vocabChuong1 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong1);
            selectedNames.push("Ch.1");
        }
        if (document.getElementById('chk-chuong2').checked && typeof vocabChuong2 !== 'undefined') {
            Object.assign(currentVocab, vocabChuong2);
            selectedNames.push("Ch.2");
        }

        if (document.getElementById('chk-tuoi').checked && typeof generateTuoiVocab === 'function') {
            Object.assign(currentVocab, generateTuoiVocab(10));
            selectedNames.push("Tuổi");
        }
        // Nếu người dùng không tick cái nào
        if (selectedNames.length === 0) {
            alert("Vui lòng chọn ít nhất 1 chương để ôn tập!");
            return;
        }

        currentChapterName = selectedNames.join(" + "); // Ví dụ: Ch.1 + Ch.2
        questions = Object.keys(currentVocab);
        
        document.getElementById('menu').style.display = 'none';
        document.getElementById('flashcard').style.display = 'block';
        
        initRound();
    }

    // Quay lại Menu
    function returnToMenu(event) {
        if(event) event.stopPropagation();
        document.getElementById('flashcard').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initRound() {
        shuffleArray(questions);
        currentIndex = 0;
        showQuestion();
    }

    function showQuestion() {
        isShowingAnswer = false;
        
        // Cập nhật giao diện đếm câu, bỏ đi phần đếm Vòng
        document.getElementById('progress').innerText = `${currentChapterName} | Câu ${currentIndex + 1}/${questions.length}`;
        document.getElementById('word-vn').innerText = questions[currentIndex];
        document.getElementById('word-jp').style.display = 'none';
        document.getElementById('speak-btn').style.display = 'none'; 
        
        const actionBtn = document.getElementById('action-btn');
        actionBtn.innerText = 'Xem đáp án (Enter)';
        actionBtn.classList.remove('btn-finish');

        const prevBtn = document.getElementById('prev-btn');
        if (currentIndex === 0) {
            prevBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'block';
        }
    }

    function speakJapanese(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; 
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function playAudio(event) {
        if(event) event.stopPropagation(); 
        const currentVN = questions[currentIndex];
        const correctJP = currentVocab[currentVN];
        speakJapanese(correctJP);
    }

    function showAnswer() {
        isShowingAnswer = true;
        const currentVN = questions[currentIndex];
        const correctJP = currentVocab[currentVN];
        
        const answerElement = document.getElementById('word-jp');
        answerElement.innerText = correctJP;
        answerElement.style.display = 'block';
        
        document.getElementById('speak-btn').style.display = 'flex';
        
        const actionBtn = document.getElementById('action-btn');
        
        if (currentIndex === questions.length - 1) {
            actionBtn.innerText = 'Kết thúc';
            actionBtn.classList.add('btn-finish');
        } else {
            actionBtn.innerText = 'Tiếp theo';
        }
    }

    // Logic kết thúc
    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= questions.length) {
            // Hiện hộp thoại hỏi người dùng
            let userChoice = confirm(`🎉 Chúc mừng! Bạn đã hoàn thành bộ ${questions.length} từ vựng!\n\nBạn có muốn ÔN LẠI ngay bây giờ không?\n- Chọn "OK" để bắt đầu lại.\n- Chọn "Cancel" (Hủy) để về Menu.`);
            
            if (userChoice) {
                // Nhấn OK -> Xáo trộn và bắt đầu lại từ đầu bộ hiện tại
                initRound();
            } else {
                // Nhấn Cancel -> Về giao diện chọn bài
                returnToMenu();
            }
        } else {
            showQuestion();
        }
    }

    function prevQuestion(event) {
        if(event) event.stopPropagation();
        
        if (currentIndex > 0) {
            currentIndex--;
            showQuestion();
        }
    }

    function handleActionClick(event) {
        if(event) event.stopPropagation();
        handleMainLogic();
    }

    function handleCardClick(event) {
        if (event.target.closest('button') || event.target.closest('input')) return;
        handleMainLogic();
    }

    function handleMainLogic() {
        if (!isShowingAnswer) {
            showAnswer();
        } else {
            nextQuestion();
        }
    }

    window.addEventListener('keydown', function(event) {
        if (document.getElementById('flashcard').style.display === 'block') {
            if (event.key === 'Enter' || event.key === 'ArrowRight') {
                handleMainLogic();
            } else if (event.key === 'ArrowLeft') {
                prevQuestion(null);
            }
        }
    });

</script>

</body>
</html>
